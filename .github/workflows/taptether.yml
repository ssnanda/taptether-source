name: 'TapTether - Build, Release & Maintenance'

# Full releases require explicit workflow_dispatch task=release after device installation.
# Build-only: [build ipa] on main produces downloadable IPA/APK/agent CI artifacts.
# LG TV MAC discovery (0.8.35): release remains manual, after device installation.
# One-time exception: [publish 202] in a main squash-merge commit triggers version
# 0.8.41+202 only, for the approved colorful dashboard IPA publication.
# VERSION commits never automatically publish. Agent-only pushes remain supported.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Action'
        type: choice
        required: true
        default: release
        options:
          - release
          - build
          - validate
          - cleanup
          - agent-ubuntu
          - agent-macos
          - agent-windows
      agent_version:
        description: 'Only for agent-* releases: next version, e.g. 0.7.8+68'
        type: string
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'app/**'
      - 'agent/**'
      - 'desktop/**'
      - 'bin/**'
      - 'docs/architecture/core-compatibility-and-release-notes.md'
      - '.github/workflows/taptether.yml'
  push:
    branches: [main, fix/v0.6-remote-scan-mac-details]
    # Agent feeds publish separately; an explicit [build xbox] merge runs a
    # build-only workflow (never a public release). No VERSION push release.
    paths:
      - 'versions/ubuntu-agent.txt'
      - 'versions/macos-agent.txt'
      - 'app/lib/xbox_*.dart'
      - 'app/test/xbox_*.dart'
      - 'app/lib/dashboard_visuals.dart'
      - 'app/lib/main.dart'
      - 'app/lib/appearance.dart'
      - 'app/lib/remote_mode_bar.dart'
      - 'app/test/dashboard_visuals_test.dart'
      - '.github/workflows/taptether.yml'
  schedule:
    # Weekly maintenance runs cleanup only, without building anything.
    - cron: '37 4 * * 0'

permissions:
  contents: read

concurrency:
  group: taptether-one-workflow-${{ github.ref }}
  # Cancel superseded PR validation, but never interrupt a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.task != 'agent-ubuntu' && inputs.task != 'agent-macos' && inputs.task != 'agent-windows' && inputs.task != 'cleanup')) && !(github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'agent-ubuntu:') || startsWith(github.event.head_commit.message, 'agent-macos:') || contains(github.event.head_commit.message, '[cleanup actions]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Release preflight (only before publishing)
        if: ${{ inputs.task == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 202]')) }}
        env:
          GH_TOKEN: ${{ secrets.TAPTETHER_PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "::error::Set private repo Actions secret TAPTETHER_PUBLIC_RELEASE_TOKEN (public taptether.com Contents: Read and write)."
            exit 1
          }
          [[ "$(gh api repos/ssnanda/taptether.com --jq '.permissions.push')" == true ]] || {
            echo "::error::Publishing credential cannot write to the public distribution repository."
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo 'Release only from main.' >&2; exit 1;
          }
          version="$(cat VERSION)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$version" != '0.8.41+202' ]]; then
            echo '::error::The [publish 202] push trigger is valid for 0.8.41+202 only.'
            exit 1
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || {
            echo 'Invalid VERSION.' >&2; exit 1;
          }
          # Refuse a future full release that would downgrade any platform-only agent.
          python3 bin/4-guard-release-sync.py
          if gh release view current -R "ssnanda/taptether.com" \
                --json name --jq '.name' 2>/dev/null | grep -Fq "TapTether $version"; then
            echo "TapTether $version is already on current. Increment VERSION before another release." >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Protected macOS helper version and permission notes
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF:-main}"
          python3 bin/4-guard-macos-cores.py FETCH_HEAD
      - name: Check shell and Python syntax
        run: |
          for script in bin/*.sh; do bash -n "$script"; done
          python3 bin/4-sync-app-version.py --check
          python3 -m py_compile desktop/ubuntu/taptether_tray.py desktop/ubuntu/taptether_screen.py bin/6-tt-generate-altstore.py bin/9-tt-brand-icons.py bin/4-test-deb-packaging.py
          python3 bin/4-check-release-pipeline.py
          python3 bin/4-test-deb-packaging.py
          python3 bin/4-test-agent-release-feeds.py
          python3 bin/4-test-ubuntu-screen-lifecycle.py
          python3 bin/4-test-ubuntu-screen-policy.py
          python3 bin/4-test-saved-devices-dashboard.py
          python3 bin/4-test-ubuntu-uninstall.py
          python3 bin/4-test-macos-uninstall.py
          python3 bin/4-test-macos-input-core.py
          python3 bin/4-test-macos-agent-recovery.py
      - name: Go agent tests and vet
        run: |
          cd agent
          go test ./...
          go vet ./...
      - name: Cross-compile Windows snapshot agent
        run: |
          cd agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/taptether-agent
      - name: Initialize Flutter runner and dependencies
        run: |
          cd app
          flutter create --platforms=android --org com.taptether --project-name taptether .
          bash ../bin/2g-tt-voice-permissions.sh
          bash ../bin/2h-tt-fridge-background.sh
          flutter pub get
      - name: Prepare bundled branding used by widget tests
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 bin/9-tt-brand-icons.py --verify
          python3 bin/9-tt-brand-icons.py
          test -s app/assets/branding/taptether.png
      - name: Flutter static analysis
        run: |
          cd app
          flutter analyze
      - name: Flutter unit and widget tests
        run: |
          cd app
          flutter test
      - name: Android debug build smoke test
        if: ${{ inputs.task == 'validate' }}
        run: |
          cd app
          flutter build apk --debug

  verify-macos-agent:
    # Lightweight native verification of the new macOS Screen Recording CGo
    # code. This job never packages, uploads or publishes artifacts.
    if: ${{ github.event_name == 'pull_request' }}
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Compile and test native macOS agents
        run: |
          cd agent
          go test ./...
          go vet ./...
      - name: Parse macOS tray UI
        run: swiftc -parse desktop/macos/TapTetherTray.swift

  build-ubuntu:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.task == 'release' || inputs.task == 'build')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build xbox]')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build ipa]')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 202]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify Ubuntu tray source
        run: python3 -m py_compile desktop/ubuntu/taptether_tray.py desktop/ubuntu/taptether_screen.py

      - name: Build Ubuntu packages
        run: bash bin/2b-tt-ubuntu.sh
      - name: Verify complete Ubuntu installer payloads
        run: python3 bin/4-validate-desktop-installers.py --platform ubuntu
      - name: Verify Ubuntu packages with native dpkg
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          for arch in amd64 arm64; do
            deb="dist/ubuntu/taptether-agent_${version}_${arch}.deb"
            dpkg-deb --info "$deb" >/dev/null
            dpkg-deb --contents "$deb" >/dev/null
          done
          # Install in disposable CI runner before publishing mobile binaries.
          sudo dpkg --install "dist/ubuntu/taptether-agent_${version}_amd64.deb"
          test "$(dpkg-query -W -f='${Status}' taptether-agent)" = 'install ok installed'
      - uses: actions/upload-artifact@v4
        with:
          name: TapTether-Ubuntu-installers
          path: dist/ubuntu/*.deb
          if-no-files-found: error
          retention-days: 1

  build-windows:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.task == 'release' || inputs.task == 'build')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build xbox]')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build ipa]')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 202]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Prepare Windows icon assets
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Cross-compile native Windows agents and installers
        run: bash bin/2c-tt-windows.sh
      - name: Validate Windows tray and installer PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in (Get-ChildItem desktop/windows -Filter '*.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax failed: $($script.Name)"
            }
          }

      - name: Verify Windows ZIP installation payloads
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          for arch in ('amd64','arm64'):
              path=Path(f'dist/windows/TapTetherAgent-Windows-{arch}-{version}.zip')
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  assert set(z.namelist()) == {
                      'TapTetherAgent.exe', 'Install-TapTether.ps1',
                      'Allow-TapTether.ps1', 'Show-Pairing.ps1',
                      'Update-TapTether.ps1',
                      'Install-TapTether.cmd', 'Show-Pairing.cmd',
                      'Configure-Shutdown.ps1', 'Configure-Shutdown.cmd',
                      'TapTetherTray.ps1',
                      'TapTether.ico',
                      'README-Windows.txt', 'version.txt'}
                  assert z.getinfo('TapTetherAgent.exe').file_size > 100000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TapTether-Windows-installers
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 1

  build-and-publish:
    needs: [build-ubuntu, build-windows]
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.task == 'release' || inputs.task == 'build')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build xbox]')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build ipa]')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 202]')) }}
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 80
    env:
      TAPTETHER_USE_PREBUILT_AGENTS: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configure Go for native macOS agents
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Configure Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Configure Python icon renderer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon renderer dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate native iOS and Android runners
        run: |
          cd app
          flutter create --platforms=ios,android --org com.taptether --project-name taptether .
          bash ../bin/2g-tt-voice-permissions.sh
          bash ../bin/2h-tt-fridge-background.sh
          flutter pub get

      - name: Render TapTether icons for every platform
        run: |
          python3 bin/9-tt-brand-icons.py --verify
          python3 bin/9-tt-brand-icons.py
          test -s dist/branding/TapTether.icns
          test -s app/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          test -s app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s tv/lg-webos/icon.png

      - name: Ensure rendered branding matches immutable release source
        run: git diff --exit-code -- assets/branding

      - name: Validate Bash installer scripts
        run: |
          for script in bin/*.sh; do bash -n "$script"; done
          python3 -m py_compile bin/6-tt-generate-altstore.py bin/9-tt-brand-icons.py desktop/ubuntu/taptether_tray.py

      - name: Validate desktop UI package sources
        run: |
          test -s desktop/ubuntu/taptether_tray.py
          test -s desktop/macos/TapTetherTray.swift
          xcrun swiftc -typecheck desktop/macos/TapTetherTray.swift
          grep -q 'TapTetherTray' bin/2b-tt-macos.sh
          grep -q 'taptether_tray.py' bin/5-install-agent-ubuntu.sh

      - name: Build native macOS agents (Intel and Apple Silicon)
        run: bash bin/2b-tt-macos.sh

      - name: Verify native macOS app and compatible agent packages
        run: python3 bin/4-validate-desktop-installers.py --platform macos

      - name: Retrieve verified Ubuntu packages from this run
        uses: actions/download-artifact@v4
        with:
          name: TapTether-Ubuntu-installers
          path: dist/ubuntu

      - name: Retrieve verified Windows packages from this run
        uses: actions/download-artifact@v4
        with:
          name: TapTether-Windows-installers
          path: dist/windows

      - name: Verify all native agent packages before app builds
        run: python3 bin/4-validate-desktop-installers.py --platform all

      - name: Build unsigned IPA with verified agents
        run: bash bin/2a-tt-ipa.sh --no-publish

      - name: Verify packaged desktop setup, splash and tray assets
        run: python3 bin/4-validate-desktop-installers.py --platform all

      - name: Build Android APK
        run: bash bin/2a-tt-apk.sh --no-publish

      - name: Make validated builds available (Build mode only)
        if: ${{ inputs.task == 'build' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build xbox]')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build ipa]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: TapTether-complete-build-${{ github.run_id }}
          path: |
            dist/ios/*.ipa
            dist/android/*.apk
            dist/ubuntu/*.deb
            dist/macos/*.tar.gz
            dist/macos/*.zip
            dist/macos/TapTetherInputCore-*.tar.gz
            dist/windows/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish current IPA, APK and agents to GitHub Releases
        if: ${{ inputs.task == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 202]')) }}
        env:
          GH_TOKEN: ${{ secrets.TAPTETHER_PUBLIC_RELEASE_TOKEN }}
        run: bash bin/6-tt-publish-latest.sh

      - name: Sync published AltStore metadata back to source main
        if: ${{ inputs.task == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 202]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          test -s altstore.json
          git fetch --quiet origin main
          current_version="$(git show origin/main:VERSION | tr -d '\r\n')"
          if [[ "$current_version" != "$version" ]]; then
            echo "::warning::New source VERSION $current_version; skip stale AltStore sync for $version"
            exit 0
          fi
          test "$(gh api repos/ssnanda/taptether.com/releases/tags/current --jq '.name')" = "TapTether $version (rolling downloads)"
          feed_hash="$(git hash-object altstore.json)"
          public_hash="$(gh api repos/ssnanda/taptether.com/contents/altstore.json --jq '.sha')"
          test "$feed_hash" = "$public_hash" || {
            echo "::error::Public AltStore feed does not match generated metadata."
            exit 1
          }
          source_hash="$(gh api repos/ssnanda/taptether-source/contents/altstore.json --jq '.sha')"
          if [[ "$source_hash" == "$feed_hash" ]]; then
            echo "AltStore metadata already synchronized."
            exit 0
          fi
          feed_base64="$(base64 < altstore.json | tr -d '\r\n')"
          gh api -X PUT repos/ssnanda/taptether-source/contents/altstore.json \
            -f message="chore: sync AltStore metadata $version [skip ci]" \
            -f content="$feed_base64" -f sha="$source_hash" -f branch=main >/dev/null
          test "$(gh api repos/ssnanda/taptether-source/contents/altstore.json --jq '.sha')" = "$feed_hash"
          echo "Synchronized source and public AltStore feeds at $version."

  agent-only-validate:
    # A separate lightweight path in the SAME workflow. Does not initialize
    # Flutter, sign iOS code, or build Android; full releases remain untouched.
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.task == 'agent-ubuntu' || inputs.task == 'agent-macos' || inputs.task == 'agent-windows')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (startsWith(github.event.head_commit.message, 'agent-ubuntu:') || startsWith(github.event.head_commit.message, 'agent-macos:'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require main and explicit agent-only version
        env:
          REQUESTED_VERSION: ${{ inputs.agent_version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Agent releases only from main.' >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$COMMIT_MESSAGE" == agent-macos:* ]]; then
              REQUESTED_VERSION="$(tr -d '\r\n' < versions/macos-agent.txt)"
            else
              REQUESTED_VERSION="$(tr -d '\r\n' < versions/ubuntu-agent.txt)"
            fi
          fi
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || {
            echo 'Set agent_version to a valid new version such as 0.7.8+68.' >&2
            exit 1
          }
      - name: Agent-only release guards
        run: |
          set -euo pipefail
          for script in bin/*.sh; do bash -n "$script"; done
          python3 -m py_compile bin/7b-tt-ubuntu-release-info.py desktop/ubuntu/taptether_tray.py
          python3 bin/4-test-agent-release-feeds.py
          python3 bin/4-test-ubuntu-screen-lifecycle.py
          python3 bin/4-test-ubuntu-screen-policy.py
          python3 bin/4-test-saved-devices-dashboard.py
          python3 bin/4-test-deb-packaging.py
          python3 bin/4-check-release-pipeline.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Test agent core
        run: cd agent && go test ./... && go vet ./...

  agent-only-ubuntu:
    needs: agent-only-validate
    if: ${{ inputs.task == 'agent-ubuntu' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'agent-ubuntu:')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Set Ubuntu package-only version without committing VERSION
        env:
          REQUESTED_VERSION: ${{ inputs.agent_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            REQUESTED_VERSION="$(tr -d '\r\n' < versions/ubuntu-agent.txt)"
          fi
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          printf '%s\n' "$REQUESTED_VERSION" > VERSION
      - name: Build and verify Ubuntu installers
        run: |
          bash bin/2b-tt-ubuntu.sh
          python3 bin/4-validate-desktop-installers.py --platform ubuntu
          for deb in dist/ubuntu/*.deb; do dpkg-deb --info "$deb"; done
      - name: Publish only Ubuntu agents
        env:
          GH_TOKEN: ${{ secrets.TAPTETHER_PUBLIC_RELEASE_TOKEN }}
        run: bash bin/6-tt-publish-agent-only.sh ubuntu

  agent-only-windows:
    needs: agent-only-validate
    if: ${{ inputs.task == 'agent-windows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon renderer
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Set package-only version without committing VERSION
        env:
          REQUESTED_VERSION: ${{ inputs.agent_version }}
        run: printf '%s\n' "$REQUESTED_VERSION" > VERSION
      - name: Verify Windows PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem desktop/windows -Filter '*.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "Invalid PowerShell: $($file.Name)" }
          }
      - name: Build Windows agents
        run: bash bin/2c-tt-windows.sh
      - name: Publish only Windows agents
        env:
          GH_TOKEN: ${{ secrets.TAPTETHER_PUBLIC_RELEASE_TOKEN }}
        run: bash bin/6-tt-publish-agent-only.sh windows

  agent-only-macos:
    needs: agent-only-validate
    if: ${{ inputs.task == 'agent-macos' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'agent-macos:')) }}
    runs-on: macos-latest
    env:
      TAPTETHER_PUBLIC_PUBLISH_ENABLED: ${{ secrets.TAPTETHER_PUBLIC_RELEASE_TOKEN != '' }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Create isolated Python environment for icon renderer
        run: |
          python3 -m venv "$RUNNER_TEMP/taptether-python"
          "$RUNNER_TEMP/taptether-python/bin/python" -m pip install --disable-pip-version-check Pillow
          echo "$RUNNER_TEMP/taptether-python/bin" >> "$GITHUB_PATH"
      - name: Verify icon renderer
        run: python3 -c 'from PIL import Image; print("Pillow available")'
      - name: Set package-only version without committing VERSION
        env:
          REQUESTED_VERSION: ${{ inputs.agent_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            REQUESTED_VERSION="$(tr -d '\r\n' < versions/macos-agent.txt)"
          fi
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || exit 1
          printf '%s\n' "$REQUESTED_VERSION" > VERSION
      - name: Validate native macOS tray and render branding
        run: |
          xcrun swiftc -typecheck desktop/macos/TapTetherTray.swift
          python3 bin/9-tt-brand-icons.py --verify
          python3 bin/9-tt-brand-icons.py
      - name: Build and validate macOS agents
        run: |
          bash bin/2b-tt-macos.sh
          python3 bin/4-validate-desktop-installers.py --platform macos
      - name: Make macOS Agent installer available for QR testing
        uses: actions/upload-artifact@v4
        with:
          name: TapTether-macOS-agent-QR-test-${{ github.run_id }}
          path: |
            dist/macos/TapTetherAgent-macos-*.zip
            dist/macos/TapTetherAgent-macos-*.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Explain missing public publish credential
        if: ${{ env.TAPTETHER_PUBLIC_PUBLISH_ENABLED != 'true' }}
        run: echo '::warning::Agent was built for private download; configure TAPTETHER_PUBLIC_RELEASE_TOKEN to also update public agent releases.'
      - name: Publish only macOS agents; never replace Screen/Input Core
        if: ${{ env.TAPTETHER_PUBLIC_PUBLISH_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.TAPTETHER_PUBLIC_RELEASE_TOKEN }}
        run: bash bin/6-tt-publish-agent-only.sh macos

  # One-time publication of the fully validated 0.8.35+196 build artifact.
  # Reuses the iOS, Android and agent packages from successful CI run 40962701309.
  publish-verified-ipa-196:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish built 196]') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify successful build provenance and release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '0.8.35+196'
          test "$(git rev-parse HEAD^)" = '01a6ff803f59ceda9ec71a62945f9798f7ae4460'
          gh api repos/ssnanda/taptether-source/actions/runs/40962701309 \
            --jq '[.conclusion, .head_sha] | join(" ")' \
            | grep -Fx 'success 01a6ff803f59ceda9ec71a62945f9798f7ae4460'

      - name: Retrieve exact validated IPA, APK, and agent packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40962701309 -R ssnanda/taptether-source \
            -n TapTether-complete-build-40962701309 -D dist
          test -s dist/ios/TapTether-0.8.35+196-unsigned.ipa
          test -s dist/android/TapTether-0.8.35+196.apk
          python3 bin/4-validate-desktop-installers.py --platform all
          echo 'Previously validated release packages retrieved intact.'

      - name: Recreate distribution icon
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 bin/9-tt-brand-icons.py
          test -s dist/branding/TapTether-icon.png

      - name: Publish built 0.8.35+196 to public rolling release
        env:
          GH_TOKEN: ${{ secrets.TAPTETHER_PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo '::error::Missing TAPTETHER_PUBLIC_RELEASE_TOKEN'; exit 1;
          }
          test "$(gh api repos/ssnanda/taptether.com --jq '.permissions.push')" = true
          bash bin/6-tt-publish-latest.sh

      - name: Verify public IPA and release title
        env:
          GH_TOKEN: ${{ secrets.TAPTETHER_PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release view current -R ssnanda/taptether.com \
            --json name --jq '.name' | grep -Fx 'TapTether 0.8.35+196 (rolling downloads)'
          gh api repos/ssnanda/taptether.com/releases/tags/current \
            --jq '.assets[].name' | grep -Fx 'TapTether.ipa'

  cleanup-history:
    needs: build-and-publish
    # Weekly, explicitly requested cleanup, one-shot maintenance merge, or a successful release.
    # A cleanup request never launches Go, Flutter, or native build jobs.
    if: ${{ always() && (github.event_name == 'schedule' || inputs.task == 'cleanup' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[cleanup actions]')) || ((inputs.task == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish 202]'))) && needs.build-and-publish.result == 'success')) }}
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete old completed Actions runs and temporary build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          current="${GITHUB_RUN_ID}"
          artifacts_file="$(mktemp)"
          runs_file="$(mktemp)"
          trap 'rm -f "$artifacts_file" "$runs_file"' EXIT

          # Take a stable snapshot before deleting: paginating during deletion
          # can skip entries when the results shift between pages.
          gh api --paginate "/repos/$repo/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select((.workflow_run.id // 0) != $current) | .id" > "$artifacts_file"
          gh api --paginate "/repos/$repo/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' > "$runs_file"

          artifacts_deleted=0
          artifacts_failed=0
          while IFS= read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            if gh api --silent -X DELETE "/repos/$repo/actions/artifacts/$id"; then
              artifacts_deleted=$((artifacts_deleted + 1))
            else
              artifacts_failed=$((artifacts_failed + 1))
            fi
            sleep 0.2
          done < "$artifacts_file"

          runs_deleted=0
          runs_failed=0
          while IFS= read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            [[ "$id" != "$current" ]] || continue
            if gh api --silent -X DELETE "/repos/$repo/actions/runs/$id"; then
              runs_deleted=$((runs_deleted + 1))
            else
              runs_failed=$((runs_failed + 1))
            fi
            sleep 0.2
          done < "$runs_file"

          {
            echo '## TapTether Actions cleanup'
            echo ''
            echo "- Temporary artifacts deleted: $artifacts_deleted"
            echo "- Completed workflow runs deleted: $runs_deleted"
            echo "- Artifacts that could not be deleted: $artifacts_failed"
            echo "- Runs that could not be deleted: $runs_failed"
            echo ''
            echo 'Current/ongoing workflow runs were not touched.'
            echo 'GitHub Releases, IPA, APK, macOS and Ubuntu installers were not touched.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Deleted $artifacts_deleted Actions artifacts and $runs_deleted completed runs."
          echo 'This deletes only private Actions artifacts/history, not GitHub Releases or published IPA downloads.'
          if (( artifacts_failed > 0 || runs_failed > 0 )); then
            echo "::warning::Some deletions failed. See job logs and permissions."
            exit 1
          fi
