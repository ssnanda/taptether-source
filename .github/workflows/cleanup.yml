name: '4 - Clean TapTether Actions history'

# Weekly cleanup plus optional manual Run workflow. Normal pushes do nothing.
on:
  schedule:
    - cron: '37 4 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: taptether-actions-cleanup
  cancel-in-progress: false

jobs:
  purge-completed-runs-and-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete temporary Actions artifacts and completed run history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          current="${GITHUB_RUN_ID}"
          artifacts_file="$(mktemp)"
          runs_file="$(mktemp)"
          trap 'rm -f "$artifacts_file" "$runs_file"' EXIT

          # Take a stable snapshot before deleting: paginating during deletion
          # can skip entries when the results shift between pages.
          gh api --paginate "/repos/$repo/actions/artifacts?per_page=100"             --jq '.artifacts[].id' > "$artifacts_file"
          gh api --paginate "/repos/$repo/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.status == "completed") | .id' > "$runs_file"

          artifacts_deleted=0
          artifacts_failed=0
          while IFS= read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            if gh api --silent -X DELETE "/repos/$repo/actions/artifacts/$id"; then
              artifacts_deleted=$((artifacts_deleted + 1))
            else
              artifacts_failed=$((artifacts_failed + 1))
            fi
            sleep 0.2
          done < "$artifacts_file"

          runs_deleted=0
          runs_failed=0
          while IFS= read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || continue
            [[ "$id" != "$current" ]] || continue
            if gh api --silent -X DELETE "/repos/$repo/actions/runs/$id"; then
              runs_deleted=$((runs_deleted + 1))
            else
              runs_failed=$((runs_failed + 1))
            fi
            sleep 0.2
          done < "$runs_file"

          {
            echo '## TapTether Actions cleanup'
            echo ''
            echo "- Temporary artifacts deleted: $artifacts_deleted"
            echo "- Completed workflow runs deleted: $runs_deleted"
            echo "- Artifacts that could not be deleted: $artifacts_failed"
            echo "- Runs that could not be deleted: $runs_failed"
            echo ''
            echo 'Current/ongoing workflow runs were not touched.'
            echo 'GitHub Releases, IPA, APK, macOS and Ubuntu installers were not touched.'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Deleted $artifacts_deleted Actions artifacts and $runs_deleted completed runs."
          if (( artifacts_failed > 0 || runs_failed > 0 )); then
            echo "::warning::Some deletions failed. See job logs and permissions."
            exit 1
          fi
