name: '2 - Build TapTether agents'
# Build agents only on explicit request; normal source commits do not run CI.
on:
  workflow_dispatch:
  # One final app ZIP + compatible-tar packaging check on this branch.
  push:
    branches: [feature/v0.6.2-macos-app-lan-scan]
    paths:
      - '.github/workflows/agents.yml'

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Go tests
        run: cd agent && go test ./... && go vet ./...
      - name: Verify Ubuntu tray source
        run: python3 -m py_compile desktop/ubuntu/taptether_tray.py

      - name: Build Ubuntu packages
        run: bash bin/2b-tt-ubuntu.sh
      - name: Verify complete Ubuntu installer payloads
        run: python3 bin/4-validate-desktop-installers.py --platform ubuntu
      - uses: actions/upload-artifact@v4
        with:
          name: TapTether-Ubuntu-installers
          path: dist/ubuntu/*.deb
          if-no-files-found: error
          retention-days: 1
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Go tests
        run: cd agent && go test ./... && go vet ./...
      - name: Configure Python for brand artwork
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Verify AppKit tray source
        run: xcrun swiftc -typecheck desktop/macos/TapTetherTray.swift
      - name: Build native macOS agents
        run: bash bin/2b-tt-macos.sh
      - name: Verify complete macOS installer payloads
        run: python3 bin/4-validate-desktop-installers.py --platform macos
      - uses: actions/upload-artifact@v4
        with:
          name: TapTether-macOS-installers
          path: |
            dist/macos/*.tar.gz
            dist/macos/*.zip
          if-no-files-found: error
          retention-days: 1
