name: Publish current TapTether release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'app/**'
      - 'agent/**'
      - 'bin/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taptether-current-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: macos-latest
    timeout-minutes: 80
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configure Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Configure Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Configure Python icon renderer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon renderer dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate native iOS and Android runners
        run: |
          cd app
          flutter create --platforms=ios,android --org com.taptether --project-name taptether .
          flutter pub get

      - name: Render TapTether icons for every platform
        run: |
          python3 bin/9-tt-brand-icons.py --verify
          python3 bin/9-tt-brand-icons.py
          test -s dist/branding/TapTether.icns
          test -s app/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          test -s app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s tv/lg-webos/icon.png

      - name: Commit new master logo PNGs to GitHub
        run: |
          git add assets/branding/TapTether-app.png assets/branding/TapTether-agent.png
          if ! git diff --cached --quiet -- assets/branding; then
            git -c user.name='TapTether Release Bot' -c user.email='actions@users.noreply.github.com' commit -m 'branding: publish actual PNG master icons'
            git push origin HEAD:main
          fi

      - name: Validate Bash installer scripts
        run: |
          for script in bin/*.sh; do bash -n "$script"; done
          python3 -m py_compile bin/6-tt-generate-altstore.py bin/9-tt-brand-icons.py

      - name: Validate Go agent and Dart
        run: |
          cd agent
          go test ./...
          go vet ./...
          cd ../app
          flutter analyze
          flutter test

      - name: Build bundled Ubuntu and macOS agents plus unsigned IPA
        run: bash bin/2a-tt-ipa.sh --no-publish

      - name: Build Android APK
        run: bash bin/2a-tt-apk.sh --no-publish

      - name: Publish current IPA, APK and agents to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/6-tt-publish-latest.sh

      - name: Upload current build outputs for CI debugging
        uses: actions/upload-artifact@v4
        with:
          name: TapTether-current-build
          path: |
            dist/release/TapTether*
            altstore.json
          retention-days: 1
          if-no-files-found: error
