name: '3 - Publish TapTether release'

# Run manually. Publishing automatically calls 1-Validate and 2-Build
# as reusable workflows against the same source SHA. No push triggers.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taptether-current-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify main and a never-published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo 'Release only from main.' >&2; exit 1;
          }
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || {
            echo 'Invalid VERSION.' >&2; exit 1;
          }
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version already published. Increment VERSION before rebuilding." >&2
            exit 1
          fi

  validate:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  agents:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/agents.yml

  build-and-publish:
    needs: agents
    runs-on: macos-latest
    timeout-minutes: 80
    env:
      TAPTETHER_USE_PREBUILT_AGENTS: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configure Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Configure Python icon renderer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon renderer dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Generate native iOS and Android runners
        run: |
          cd app
          flutter create --platforms=ios,android --org com.taptether --project-name taptether .
          flutter pub get

      - name: Render TapTether icons for every platform
        run: |
          python3 bin/9-tt-brand-icons.py --verify
          python3 bin/9-tt-brand-icons.py
          test -s dist/branding/TapTether.icns
          test -s app/ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png
          test -s app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s tv/lg-webos/icon.png

      - name: Ensure rendered branding matches immutable release source
        run: git diff --exit-code -- assets/branding

      - name: Validate Bash installer scripts
        run: |
          for script in bin/*.sh; do bash -n "$script"; done
          python3 -m py_compile bin/6-tt-generate-altstore.py bin/9-tt-brand-icons.py desktop/ubuntu/taptether_tray.py

      - name: Validate desktop UI package sources
        run: |
          test -s desktop/ubuntu/taptether_tray.py
          test -s desktop/macos/TapTetherTray.swift
          xcrun swiftc -typecheck desktop/macos/TapTetherTray.swift
          grep -q 'TapTetherTray' bin/2b-tt-macos.sh
          grep -q 'taptether_tray.py' bin/5-tt-remote-install-ubuntu.sh

      - name: Retrieve Ubuntu packages verified by 2 - Build agents
        uses: actions/download-artifact@v4
        with:
          name: TapTether-Ubuntu-installers
          path: dist/ubuntu

      - name: Retrieve macOS packages verified by 2 - Build agents
        uses: actions/download-artifact@v4
        with:
          name: TapTether-macOS-installers
          path: dist/macos

      - name: Reverify same-run native agent packages
        run: python3 bin/4-validate-desktop-installers.py --platform all

      - name: Build unsigned IPA from verified agents
        run: bash bin/2a-tt-ipa.sh --no-publish

      - name: Verify packaged desktop setup, splash and tray assets
        run: python3 bin/4-validate-desktop-installers.py --platform all

      - name: Build Android APK
        run: bash bin/2a-tt-apk.sh --no-publish

      - name: Publish current IPA, APK and agents to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/6-tt-publish-latest.sh
